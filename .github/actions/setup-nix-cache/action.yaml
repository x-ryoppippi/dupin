name: Setup Nix with a persistent store
description: Install Nix with persistent caches through the shared setup action
inputs:
  cache-scope:
    description: Unique matrix-entry identifier used to keep caches separate
    default: ''
  save:
    description: Whether this job may persist the store for later runs
    default: 'true'
runs:
  using: composite
  steps:
    - uses: x-ryoppippi/setup-nix@2b47573374b517ae165cba29a8cb83e20d9102dc # v0.0.9
      with:
        cache: auto
        cache-scope: ${{ inputs.cache-scope }}
        save: ${{ inputs.save }}
        extra-conf: |
          keep-derivations = true
          keep-outputs = true
