name: Setup Nix with a persistent store
description: Install Nix with persistent caches through the shared setup action
inputs:
  cache-scope:
    description: Unique matrix-entry identifier used to keep caches separate
    default: ''
  save:
    description: Whether this job may persist the store for later runs
    default: 'true'
runs:
  using: composite
  steps:
    - uses: x-ryoppippi/setup-nix@15c91a13ce46cdca33d01b876babf70491be362b # v0.0.3
      with:
        cache: auto
        cache-scope: ${{ inputs.cache-scope }}
        # Only the default branch writes. Hestia treats a pack key that already exists as uploaded
        # even when this run cannot download it, and Blacksmith scopes entries to the branch that
        # wrote them, so a path a pull request pushed first could stay in main's manifest without
        # being servable from main, and Hestia never re-pushes a path its manifest lists.
        save: ${{ inputs.save == 'true' && github.event_name != 'pull_request' }}
        extra-conf: |
          keep-derivations = true
          keep-outputs = true
