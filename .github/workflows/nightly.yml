name: Nightly

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency: nightly

permissions: {}

jobs:
  changed:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      # A dispatch skips the check, so only a scheduled run that found nothing new is 'false'.
      build: ${{ steps.published.outputs.build != 'false' }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" >> "$GITHUB_OUTPUT"

      # A scheduled run publishes only when main has moved since the published nightly, so
      # installed copies aren't offered the same build again.
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false
      - if: github.event_name == 'schedule'
        uses: ./.github/actions/setup-nix-cache
        with:
          save: 'false'
      - if: github.event_name == 'schedule'
        run: nix profile install --inputs-from . nixpkgs#just nixpkgs#nushell
      - id: published
        name: Check whether the nightly is already up to date
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.head.outputs.sha }}
        run: just nightly-check "$GITHUB_REPOSITORY" "$SHA"

  package:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/package.yml
    with:
      channel: nightly
      ref: ${{ needs.changed.outputs.sha }}
    secrets:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
