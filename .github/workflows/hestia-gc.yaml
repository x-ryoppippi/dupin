name: Hestia cache GC

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: true

permissions: {}

jobs:
  gc:
    permissions:
      actions: write
      contents: read
    uses: x-ryoppippi/setup-nix/.github/workflows/gc.yaml@d9a95997901339a23a1a6e3f542e6771f5ddd45a # v0.0.4
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
