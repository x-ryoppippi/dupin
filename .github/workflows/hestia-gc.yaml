name: Hestia cache GC

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: true

permissions: {}

jobs:
  gc:
    permissions:
      actions: write
      contents: read
    uses: x-ryoppippi/setup-nix/.github/workflows/gc.yaml@15c91a13ce46cdca33d01b876babf70491be362b # v0.0.3
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
