name: Website

# dupin.app: built on every pull request that changes it, and deployed with `cf deploy` when the
# change reaches main. The site renders docs/, the logo and VERSION, so those count as changes.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - assets/logo/**
      - VERSION
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - assets/logo/**
      - VERSION
      - .github/workflows/website.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  # A deployment that started finishes; a newer push to a pull request replaces its build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      # setup-nix's Hestia cache checks for evicted packs up front.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - run: nix profile install --inputs-from . nixpkgs#nodejs nixpkgs#pnpm_12 nixpkgs#just
      - run: just website::build
      - run: just website::lint

      # Until the repository has the credentials, main skips the deployment and says why
      # instead of failing.
      - name: Check for Cloudflare credentials
        id: credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ "$HAS_ACCOUNT" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=dupin.app not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the website (docs/development.md#deployment)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy dupin.app
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just website::deploy
