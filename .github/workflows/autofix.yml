# autofix.ci only accepts fixes from a workflow with this exact name.
name: autofix.ci

on:
  pull_request:
    # The vendor hash only depends on Cargo.lock; website/ has its own lockfile.
    paths-ignore:
      - 'website/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # setup-nix's Hestia cache checks for evicted packs up front.
  actions: read

jobs:
  cargo-hash:
    # The package only evaluates for aarch64-darwin, so nix-update must run there.
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cache
        with:
          cache-scope: autofix

      - run: nix shell --inputs-from . nixpkgs#nushell nixpkgs#nix-update --command nu scripts/update-cargo-hash.nu

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
