name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target runs this workflow as the base branch defines it, with a token that
  # can write; that is how it can record signatures and comment on forks' pull requests. It
  # checks out no pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
        && (github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/x-ryoppippi/dupin/blob/main/CLA.md
          # Signatures live on their own unprotected branch, away from main.
          branch: cla-signatures
          allowlist: ryoppippi,dependabot[bot],renovate[bot],github-actions[bot],coderabbitai[bot]
