# A separate workflow because CI's token is read-only on pull requests from forks, so CI
# itself cannot comment. This one executes only the base repository's default-branch code, and
# reads the pull request's measurement as data (scripts/size.nu checks it before rendering).
name: Size comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    # Main's measurements are only recorded, as CI's `size` artifacts.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cache
        with:
          save: 'false'

      - name: Report the app's size
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          marker='<!-- dupin-size -->'
          current_pr() {
            gh api "repos/$REPO/pulls?state=open&head=$HEAD_OWNER:$HEAD_BRANCH" \
              --jq ".[] | select(.head.sha == \"$SHA\") | .number" | head -n1
          }
          number=$(current_pr)
          if [[ -z $number ]]; then
            echo 'The pull request has moved past this commit; not commenting.'
            exit 0
          fi
          if ! gh run download "$RUN_ID" --repo "$REPO" --name size --dir "$RUNNER_TEMP/size"; then
            echo 'CI measured no size, as when only website/ changed; not commenting.'
            exit 0
          fi

          body=$RUNNER_TEMP/body.md
          nix shell --inputs-from . nixpkgs#nushell --command nu --no-config-file scripts/size.nu report \
            "$RUNNER_TEMP/size/size.json" --repo "$REPO" --branch "$BRANCH" --commit "$SHA" --run-url "$RUN_URL" >"$body"

          if [[ $(current_pr) != "$number" ]]; then
            echo 'The pull request changed while measuring; not commenting.'
            exit 0
          fi
          list=repos/$REPO/issues/$number/comments
          existing=$(gh api --paginate "$list" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [[ -n $existing ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" >/dev/null
          else
            gh api --method POST "$list" -F "body=@$body" >/dev/null
          fi
