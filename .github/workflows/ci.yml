name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # setup-nix's Hestia cache checks for evicted packs up front.
  actions: read

jobs:
  # A pull request that only touches website/ cannot change the app, so the macOS build and the
  # e2e run skip; skipped jobs still satisfy the required checks, which paths-ignore would not.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: hustcer/setup-nu@1b8faed9a8ff673c8ce0beae243e0b72d0787241 # v3.30
        with:
          version: '0.116.1'
      - id: diff
        name: Decide whether the app could have changed
        shell: nu {0}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          let app = if $env.EVENT != 'pull_request' {
            true
          } else {
            gh pr diff $env.PR --repo $env.GITHUB_REPOSITORY --name-only
            | lines
            | any {|path| not ($path | str starts-with 'website/') }
          }
          $"app=($app)\n" | save --append $env.GITHUB_OUTPUT

  check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Apple silicon (M4); Dupin targets nothing else. Labels: docs.blacksmith.sh, "Instance Types".
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cache

      # treefmt, clippy, tests (debug, as cargo runs them) and the release app bundle
      # (`packages.dupin` is one of the checks).
      - run: nix flake check

      # The bundle is already in the store from the check. tar keeps its executable bits,
      # which upload-artifact drops.
      - run: |
          nix build .#dupin
          tar -czf "$RUNNER_TEMP/Dupin.app.tar.gz" -C result/Applications Dupin.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dupin.app
          path: ${{ runner.temp }}/Dupin.app.tar.gz
          if-no-files-found: error

  e2e:
    needs: check
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - uses: ./.github/actions/e2e
        with:
          artifact: Dupin.app
