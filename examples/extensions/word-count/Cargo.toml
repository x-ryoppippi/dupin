[package]
name = "dupin-word-count"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dupin-plugin-protocol = { path = "../../../crates/dupin-plugin-protocol" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Not a member of the root workspace: it builds for wasm32 on its own.
[workspace]
