[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The release version lives in VERSION, which tagpr bumps. Crate versions stay put so a
# release doesn't rewrite Cargo.lock.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
homepage = "https://dupin.app"
license = "GPL-3.0-or-later"

[workspace.dependencies]
dupin-plugin-protocol = { path = "crates/dupin-plugin-protocol" }
dupin-core = { path = "crates/dupin-core" }
dupin-mac = { path = "crates/dupin-mac" }

# Rune is pre-release: pin a `dev` rev (`dev` is never rewritten) and patch every crate
# Rune's own workspace patches, at the same rev. Cargo doesn't inherit a dependency's patches.
rune = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75", default-features = false, features = [
	"accessibility",
	"metal-backend",
	# The settings window's icons are SVG.
	"svg",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75", default-features = false }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }
# OpenCode's colours and icons for the settings window, as Hex draws its own. Its fonts are a
# const the app never reads, so they stay out of the binary.
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }

libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = [
	"std",
	"objc2-app-kit",
	"QLPreviewItem",
	"QLPreviewPanel",
] }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-text = { version = "0.3", default-features = false }
objc2-metal = { version = "0.3", default-features = false }
objc2-service-management = { version = "0.3", default-features = false }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Rune's own wgpu, for the compositor that draws the query field's backdrop.
wgpu = { version = "30.0.2", default-features = false }
# The shader compiler Rune already links, to check a user's backdrop shader as Rune's Metal backend
# will compile it, before it reaches the GPU.
naga = { version = "30.0.2", default-features = false, features = ["wgsl-in", "msl-out"] }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "fcef33a2f60db30a7a872844464f84ff26f3fc75" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# QuickJS-ng runs at -O3: about half the latency of -Oz for about 0.47 MiB more (see
# experiments/js-runtime).
[profile.release.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rquickjs-sys]
opt-level = 3

# The release build's code with Rune's headless tooling, for scripts/latency.nu. Thin LTO keeps a
# CI build to minutes; the comparisons it serves are all between builds of this same profile.
[profile.latency]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
