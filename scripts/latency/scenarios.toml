# Keypress-to-results scenarios for scripts/latency.nu.
#
# A scenario's id names what a person types, not the code that answers it, so a bundled
# extension that replaces a feature is measured under the same ids: add an implementation
# beside `native` under `[features.<feature>]` and every scenario of that feature runs with
# it too. A feature with more than one implementation is held to parity: `nu
# scripts/latency.nu parity` fails when another implementation's p95 exceeds native's beyond
# the tolerance.
#
# Each implementation names the config Dupin starts with, the provider that answers it (every
# measured keypress must search it and the whole of `typed` must show its rows, so a scenario
# that never reaches its feature fails rather than timing another one) and, optionally, an
# `extensions` directory copied beside the config and `settings` merged over the config. An
# implementation that `extends` another of its feature starts from that one, so the port of a
# built-in declares only its extensions and the settings that hand the feature to them:
#
#   [features.snippets.extension]
#   extends = "native"
#   settings = { extensions = true, snippets = { enabled = false } }
#   provider = "extension.snippets"
#   extensions = "scripts/latency/snippets.extensions"
#
# A feature that only an extension has ever answered has nothing native to keep parity with, so
# its implementation names `budget_ms` instead: `parity` fails when its p95 exceeds it.
# `clipboard_entries` replaces the clipboard history's five fixture entries with that many,
# from `clipboard-fixture` in scripts/latency.nu.
#
# `prefix` is typed in one go and not measured; each character of `typed` is one measured
# keypress.

[features.search.native]
config = "scripts/headless/config/dupin/config.toml"
provider = "apps.search"

# Calendar search is the bundled extension `calendar`, held to the native search it replaced
# until the native one was removed.
[features.calendar.extension]
config = "scripts/headless/calendar.toml"
provider = "calendar.events"

[features.dictionary.native]
config = "scripts/headless/config/dupin/config.toml"
provider = "dictionary.lookup"

# Clipboard history is the bundled extension `clipboard-history`, held to the native history it
# replaced (scripts/latency/native-baseline.json), with 5,000 copies: the history a heavy user
# keeps for a week.
[features.clipboard.extension]
config = "scripts/headless/clipboard.toml"
settings = { clipboard = { max_entries = 10000 } }
provider = "clipboard.history"
clipboard_entries = 5000

[features.web.native]
config = "scripts/headless/config/dupin/config.toml"
provider = "web.keywords"

[features.snippets.native]
config = "scripts/headless/snippets.toml"
provider = "snippets.search"

# A 5,000-row items() catalogue under its keyword. Loading it is the warm-up's work; a measured
# keypress only matches the rows Dupin holds and calls into no extension.
[features.catalogue.extension]
config = "scripts/headless/config/dupin/config.toml"
settings = { extensions = true }
provider = "extension.catalogue"
extensions = "scripts/latency/catalogue.extensions"

# The main search with that catalogue in it, as its `defaultSearch` asks. It adds to apps rather
# than replacing a built-in, so it has no native implementation to hold to parity.
[features.search-catalogue.extension]
config = "scripts/headless/config/dupin/config.toml"
settings = { extensions = true }
provider = "extension-search.catalogue"
extensions = "scripts/latency/catalogue.extensions"

# The bundled Emoji & Symbols catalogue under its keyword, held to the keystroke budget, since
# nothing native ever answered it. The latency binary is built outside the source tree, so it
# finds no bundled extensions there: the repository's `extensions/` is its extensions folder
# instead, where a copy of a bundled package runs as the package does.
[features.emoji.extension]
config = "scripts/headless/config/dupin/config.toml"
settings = { extensions = true }
provider = "extension.emoji"
extensions = "extensions"
budget_ms = 5.0

[[scenarios]]
id = "search.saf"
feature = "search"
prefix = ""
typed = "saf"

[[scenarios]]
id = "search.term"
feature = "search"
prefix = ""
typed = "term"

[[scenarios]]
id = "calendar.rev"
feature = "calendar"
prefix = "cal "
typed = "rev"

[[scenarios]]
id = "dictionary.run"
feature = "dictionary"
prefix = "define "
typed = "run"

[[scenarios]]
id = "clipboard.bak"
feature = "clipboard"
prefix = "clip "
typed = "bak"

[[scenarios]]
id = "web.rust"
feature = "web"
prefix = "g "
typed = "rust"

[[scenarios]]
id = "snippets.sig"
feature = "snippets"
prefix = "snip "
typed = "sig"

[[scenarios]]
id = "catalogue.term"
feature = "catalogue"
prefix = "cat "
typed = "term"

[[scenarios]]
id = "catalogue.rel"
feature = "catalogue"
prefix = "cat "
typed = "rel"

[[scenarios]]
id = "search-catalogue.term"
feature = "search-catalogue"
prefix = ""
typed = "term"

[[scenarios]]
id = "emoji.thumb"
feature = "emoji"
prefix = "emoji "
typed = "thumb"

# A Japanese keyword, as an input method commits it.
[[scenarios]]
id = "emoji.ja"
feature = "emoji"
prefix = "emoji "
typed = "にっこり"
