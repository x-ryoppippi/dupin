# A clip is a short recording of `steps` played into the panel, rendered to
# docs/images/<page>/<name>-<theme>.webp with a caption below the panel naming each key it
# presses and the text it types. A step types text one character at a time (`type`, or all at
# once with `burst = true`, for a search that would answer each prefix), presses a key (`key`,
# with `cmd`, `shift`, `alt` or `ctrl`) or waits (`wait`, in seconds). `fixtures` names a scenario
# whose sidecar fixtures the clip runs with, and `config` a configuration in place of the default
# one, and `backdrop` a backdrop shader as `config.toml` names it. Every clip is embedded under
# the steps of its page.
#
# The website's clips, on page `home`, play on a dark page only (`themes = ["dark"]`), at the
# `scale` that keeps them sharp on a Retina screen at the size the page shows them. A backdrop shader changes every pixel
# of every frame, so they are MP4 videos over the page's black (`video = true`, with a WebP
# poster of the last frame).
#
# A `glass = true` clip shows Liquid Glass, which a headless render draws as an opaque fallback,
# so `just docs-glass` (scripts/docs-glass.nu) records it from the real app over a `wallpaper`
# (one of its presets or an image, the manifest's `wallpaper` unless the clip names its own) and
# lists it in docs/images/glass.json. Until then `just docs-clips` renders it headless over its
# `backdrop` in its place, and the website says so.
#
# A clip never types into a Spotlight search (Files after Space, or `in`): Spotlight answers
# from this Mac's index, whatever the scratch home holds. Files clips start from Recent items and
# folder browsing, which read only the scratch home.

[[clips]]
page = "tutorial"
name = "apps"
steps = [{ type = "maps" }, { key = "k", cmd = true }]

[[clips]]
page = "tutorial"
name = "files"
steps = [{ wait = 1.2 }, { key = "tab" }, { type = "ann" }]

