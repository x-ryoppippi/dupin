# The images in docs/images, which `nu scripts/docs-images.nu` (`just docs-images`) renders,
# each in light and dark, to docs/images/<page>/<name>-<theme>.png.
#
# An image is either an `extension`'s fixture (`fixture`, in its fixtures folder, rendered after
# `step` or its last step by `dupin ext snap`), or a headless launcher `scenario` with the
# sidecar fixtures scripts/snap.nu reads beside it, an optional `config` in place of its own, the
# documents below in ~/Documents and the `recent` history below. A scenario with a `window` draws
# that window, `width` points wide, instead of the panel.
#
# Spotlight indexes nothing in the scratch home, and on some Macs not even a fresh disk image, so
# no image shows a Spotlight search; the files scenarios start from Recent items instead.

# What the scratch home opened before, the first most often and most recently.
recent = [
	"~/Documents/Reports",
	"/System/Applications/Notes.app",
	"~/Documents/Budget 2026.numbers",
	"/System/Applications/Calendar.app",
	"~/Documents/Meeting notes.md",
	"/System/Applications/Maps.app",
]

# Folders end with a slash.
documents = [
	"Budget 2026.numbers",
	"Meeting notes.md",
	"Travel plans.pages",
	"Reports/",
	"Reports/Quarterly report.pdf",
	"Reports/Annual report 2026.pdf",
	"Reports/Expense report.numbers",
	"Reports/report-notes.md",
	"Projects/",
	"Projects/Launcher/",
	"Projects/Launcher/README.md",
	"Projects/Launcher/roadmap.md",
	"Projects/Garden/",
	"Projects/Garden/planting plan.txt",
	"Projects/Website/",
	"Projects/Website/index.html",
	"Projects/notes.md",
	"Recipes/",
	"Recipes/Sourdough.md",
]

