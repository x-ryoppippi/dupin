# The other names Spotlight knows an app by (kMDItemAlternateNames and kMDItemKeywords), which
# the apps source matches too, a little below the name Finder shows.
[names]
"Books" = ["Apple Books", "iBooks"]
"ChatGPT" = ["Codex"]
"Find My" = ["Find My iPhone", "Find My Mac"]
"Music" = ["Apple Music", "Apple Radio", "Cloud Music Library"]
"Passwords" = ["Keychain Passwords"]
"Podcasts" = ["Apple Podcasts"]
"QuickTime Player" = ["QuickTime"]
"Screenshot" = ["Grab"]
"Script Editor" = ["AppleScript Editor"]
"System Settings" = ["System Preferences", "Preferences", "Settings"]
"TV" = ["Apple TV"]
"Visual Studio Code" = ["Code"]
"zoom.us" = ["Zoom"]

# Commands a keyword enters, as the bundled extensions and config.toml's defaults register them.
[[commands]]
id = "calendar.events"
title = "Calendar"
keywords = ["cal"]

[[commands]]
id = "dictionary.lookup"
title = "Dictionary"
keywords = ["define", "d"]

[[commands]]
id = "clipboard.history"
title = "Clipboard History"
keywords = ["clip"]

[[commands]]
id = "extension.emoji"
title = "Emoji & Symbols"
keywords = ["emoji"]

[[commands]]
id = "snapshots.list"
title = "Snapshots"
keywords = ["snap"]

[[commands]]
id = "snippets.search"
title = "Snippets"
keywords = ["snip"]

[[commands]]
id = "extension.dupin"
title = "Dupin Help"
keywords = ["help"]

# Web searches, by alias: the bundled web-search package's, then ones a user added.
[web]
g = "Google"
gh = "GitHub"
maps = "Apple Maps"
yt = "YouTube"
ddg = "DuckDuckGo"
w = "Wikipedia"
npm = "npm"
crates = "crates.io"
mdn = "MDN"
az = "Amazon"

# [aliases] in config.toml: the user's own shorthands for apps.
[aliases]
vs = "Visual Studio Code"
term = "Ghostty"
ob = "Obsidian"

