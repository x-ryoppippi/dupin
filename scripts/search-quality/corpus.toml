# What scripts/search-quality.nu's cases search: a Mac's apps, the commands and web searches
# keywords reach, aliases, and a heavy user's history. Fixtures only; nothing here is read from
# a real Mac. See docs/development.md, "Search quality".

# App names as Finder shows them, by the folder their bundles are in. The first folders are a
# stock macOS install's (the CoreServices ones hold only the apps Dupin lists from outside the
# app folders); /Applications adds Apple's own apps and a plausible set of third-party ones,
# chosen for names that compete for the same few letters.
[apps]
"/System/Applications" = [
	"App Store",
	"Automator",
	"Books",
	"Calculator",
	"Calendar",
	"Chess",
	"Clock",
	"Contacts",
	"Dictionary",
	"FaceTime",
