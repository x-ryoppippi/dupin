# What a person wants and what they type for it, for scripts/search-quality.nu: each case's
# `query` is typed one character at a time into the main search over corpus.toml, and the
# benchmark records where the `intent` row is after every keystroke.
#
# - `id`: names the case; keep it when editing the case, so a pull request is compared with
#   main's figures for it. Lowercase letters, digits, `.` and `-`.
# - `intent`: the row wanted. `app:<name>` (as corpus.toml lists it), `command:<id>` (the row
#   naming a command a keyword enters), `web:<alias>` (a web search) or `system:<title>`.
# - `query`: what a person would type until it is first, the whole of it; the benchmark finds
#   how much of it is needed. A case records how Dupin ranks today, good or poor: a case that
#   never reaches first is a known weakness to improve, not an error.
# - `history`: the corpus histories it runs with; `base` (a heavy user's) by default, `[]` for
#   a fresh install.
# - `tags`: what the case covers, for reading the results.
#
# See docs/development.md, "Search quality".

