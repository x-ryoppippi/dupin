[package]
name = "dupin-plugin-runtime"
description = "Bounded Wasm query execution for Dupin plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-plugin-protocol = { workspace = true }
# Preserve the portable dispatch fallback when LLVM cannot guarantee tail calls.
wasmi = { version = "=2.0.2", default-features = false, features = [
	"std",
	"validate",
	"auto-dispatch",
] }

[dev-dependencies]
wat = "1"

[lints]
workspace = true
