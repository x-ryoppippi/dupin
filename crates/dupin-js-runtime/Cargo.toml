[package]
name = "dupin-js-runtime"
description = "Bounded JavaScript (QuickJS-ng) execution for Dupin extensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-plugin-protocol = { workspace = true }
# `rust-alloc` and `allocator` stay off: QuickJS's own allocator is what enforces the heap limit.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
serde = { workspace = true }
serde_json = { workspace = true }
# TypeScript erasure needs the parser and its AST only. The parser's `regular_expression`
# feature stays off: QuickJS parses regular expressions itself.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = { version = "=0.157.0", default-features = false }
oxc_span = "=0.157.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
