[package]
name = "dupin-extension-install"
description = "Installs Dupin extension packages from Git or a folder and pins them in extensions.lock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
# Rune already links it, so hashing installed packages adds no crate to the app.
blake3 = "1.8"
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
