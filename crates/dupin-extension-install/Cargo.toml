[package]
name = "dupin-extension-install"
description = "Installs Dupin extension packages from GitHub, Git or a folder and pins them in the installed extensions list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-spawn = { workspace = true }
# Rune already links it, so hashing installed packages adds no crate to the app.
blake3 = "1.8"
dupin-broker = { path = "../dupin-broker" }
# The app already links it for PNG decoding, so unpacking GitHub tarballs adds no crate.
flate2 = "1.1"
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Checks each file of a GitHub tarball against the blob id in the commit's tree.
sha1_smol = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
