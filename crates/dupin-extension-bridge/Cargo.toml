[package]
name = "dupin-extension-bridge"
description = "Connects guest JavaScript's host requests to Dupin's host services through the capability broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
dupin-broker = { path = "../dupin-broker" }
dupin-extension-host = { path = "../dupin-extension-host" }
dupin-extension-http = { path = "../dupin-extension-http" }
dupin-host-services = { path = "../dupin-host-services" }
dupin-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
dupin-spawn = { workspace = true }
dupin-extension-host = { path = "../dupin-extension-host", features = ["testing"] }
dupin-js-runtime = { path = "../dupin-js-runtime" }
dupin-plugin-protocol = { workspace = true }
tempfile = "3"

[lints]
workspace = true
