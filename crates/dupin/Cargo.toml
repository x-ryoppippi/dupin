[package]
name = "dupin"
description = "A lightweight resident launcher for Apple silicon Macs, built with Rune."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[features]
# Rune's headless runs outside a debug build, for the latency benchmark (scripts/latency.nu).
tooling = ["rune/tooling"]

[dependencies]
blake3 = "1.8.7"
fend-core = "1.5.9"
pico-args = "0.5"
roxmltree = "0.21.2"
dupin-plugin-protocol = { workspace = true }
dupin-js-runtime = { path = "../dupin-js-runtime" }
dupin-broker = { path = "../dupin-broker" }
dupin-extension-bridge = { path = "../dupin-extension-bridge" }
dupin-extension-host = { path = "../dupin-extension-host" }
dupin-extension-http = { path = "../dupin-extension-http" }
dupin-extension-install = { path = "../dupin-extension-install" }
dupin-ext-sdk = { path = "../dupin-ext-sdk" }
dupin-host-services = { path = "../dupin-host-services" }
dupin-core = { workspace = true }
dupin-mac = { workspace = true }
libc = { workspace = true }
rune = { workspace = true }
rune-notify = { workspace = true }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
toml = { workspace = true, features = ["display"] }
wgpu = { workspace = true }
naga = { workspace = true }
# Metal's own compiler and pipeline builder, which Rune links, to check a backdrop shader as
# Rune's backend will draw it.
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
	"std",
	"NSError",
	"NSProcessInfo",
	"NSString",
	"NSURL",
] }
objc2-metal = { workspace = true, features = [
	"std",
	"MTLDevice",
	"MTLLibrary",
	"MTLPixelFormat",
	"MTLRenderPipeline",
] }

[build-dependencies]
dupin-extension-install = { path = "../dupin-extension-install" }

[dev-dependencies]
dupin-extension-host = { path = "../dupin-extension-host", features = ["testing"] }

[lints]
workspace = true
