[package]
name = "dupin"
description = "A lightweight resident launcher for Apple silicon Macs, built with Rune."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-core = { workspace = true }
dupin-mac = { workspace = true }
libc = { workspace = true }
rune = { workspace = true }
rune-notify = { workspace = true }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true, features = ["display"] }
wgpu = { workspace = true }
naga = { workspace = true }
# Metal's own compiler and pipeline builder, which Rune links, to check a backdrop shader as
# Rune's backend will draw it.
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSError", "NSProcessInfo", "NSString"] }
objc2-metal = { workspace = true, features = [
	"std",
	"MTLDevice",
	"MTLLibrary",
	"MTLPixelFormat",
	"MTLRenderPipeline",
] }

[lints]
workspace = true
