[package]
name = "dupin"
description = "A lightweight resident launcher for Apple silicon Macs, built with Rune."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
fend-core = "1.5.9"
pico-args = "0.5"
roxmltree = "0.21.2"
dupin-plugin-protocol = { workspace = true }
dupin-plugin-runtime = { path = "../dupin-plugin-runtime" }
dupin-js-runtime = { path = "../dupin-js-runtime" }
dupin-core = { workspace = true }
dupin-mac = { workspace = true }
libc = { workspace = true }
rune = { workspace = true }
rune-notify = { workspace = true }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true, features = ["display"] }
wgpu = { workspace = true }
naga = { workspace = true }
# Metal's own compiler and pipeline builder, which Rune links, to check a backdrop shader as
# Rune's backend will draw it.
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
	"std",
	"NSError",
	"NSProcessInfo",
	"NSString",
	"NSURL",
] }
objc2-metal = { workspace = true, features = [
	"std",
	"MTLDevice",
	"MTLLibrary",
	"MTLPixelFormat",
	"MTLRenderPipeline",
] }

[dev-dependencies]
tempfile = "3"
wat = "1"

[lints]
workspace = true
