[package]
name = "dupin-extension-host"
description = "Runs Dupin's JavaScript extensions in a sandboxed helper process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-js-runtime = { path = "../dupin-js-runtime" }
dupin-plugin-protocol = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Lets other crates' tests skip where the extension host can't start, and stand in for a
# compiled package where they never run one.
testing = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
