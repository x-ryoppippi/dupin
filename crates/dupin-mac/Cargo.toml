[package]
name = "dupin-mac"
description = "macOS providers and actions for Dupin: installed apps, Spotlight file search, NSWorkspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-core = { workspace = true }
libc = { workspace = true }
rune = { workspace = true }
objc2 = { workspace = true }
block2 = "0.6"
objc2-foundation = { workspace = true, features = [
	"std",
	"NSArray",
	"NSBundle",
	"NSCalendar",
	"NSDate",
	"NSDateFormatter",
	"NSDateIntervalFormatter",
	"NSDictionary",
	"NSEnumerator",
	"NSError",
	"NSFileManager",
	"NSFormatter",
	"NSGeometry",
	"NSLocale",
	"NSNotification",
	"NSMetadata",
	"NSMetadataAttributes",
	"NSCompoundPredicate",
	"NSObjCRuntime",
	"NSObject",
	"NSOperation",
	"NSPredicate",
	"NSRunLoop",
	"NSString",
	"NSTimeZone",
	"NSURL",
	"NSUserDefaults",
	"NSValue",
	"block2",
] }
objc2-app-kit = { workspace = true, features = [
	"std",
	"NSEvent",
	"NSGraphics",
	"NSApplication",
	"NSPasteboard",
	"NSPasteboardItem",
	"NSResponder",
	"NSScreen",
	"NSSharingService",
	"NSView",
	"NSWindow",
	"NSWorkspace",
	"NSRunningApplication",
	"block2",
	"libc",
] }
objc2-quick-look-ui = { workspace = true }
objc2-event-kit = { version = "0.3", default-features = false, features = [
	"std",
	"block2",
	"EKCalendar",
	"EKCalendarItem",
	"EKEvent",
	"EKEventStore",
	"EKObject",
	"EKTypes",
] }
objc2-service-management = { workspace = true, features = [
	"objc2",
	"objc2-foundation",
	"SMAppService",
] }

objc2-core-foundation = { workspace = true, features = [
	"std",
	"CFArray",
	"CFDictionary",
	"CFNumber",
	"CFPreferences",
	"CFString",
	"CFURL",
] }
objc2-core-text = { workspace = true, features = ["std", "CTFont", "CTFontDescriptor"] }
memmap2 = { workspace = true }
tempfile = "3"

[lints]
workspace = true
