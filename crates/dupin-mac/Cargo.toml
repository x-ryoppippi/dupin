[package]
name = "dupin-mac"
description = "macOS providers and actions for Dupin: installed apps, Spotlight file search, NSWorkspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
dupin-core = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
	"std",
	"NSArray",
	"NSBundle",
	"NSDate",
	"NSDictionary",
	"NSEnumerator",
	"NSFileManager",
	"NSNotification",
	"NSMetadata",
	"NSMetadataAttributes",
	"NSCompoundPredicate",
	"NSObjCRuntime",
	"NSObject",
	"NSPredicate",
	"NSRunLoop",
	"NSString",
	"NSURL",
	"NSValue",
] }
objc2-app-kit = { workspace = true, features = [
	"std",
	"NSEvent",
	"NSApplication",
	"NSResponder",
	"NSScreen",
	"NSView",
	"NSWindow",
	"NSWorkspace",
] }
objc2-quick-look-ui = { workspace = true }

objc2-core-foundation = { workspace = true, features = ["std", "CFString", "CFURL"] }
objc2-core-text = { workspace = true, features = ["std", "CTFont", "CTFontDescriptor"] }
memmap2 = { workspace = true }

[lints]
workspace = true
