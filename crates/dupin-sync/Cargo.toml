[package]
name = "dupin-sync"
description = "Folder-based, end-to-end encrypted sync of Dupin's storage namespaces between Macs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
dupin-storage = { workspace = true }
getrandom = "0.4"
hkdf = "0.13"
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.11", default-features = false }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
