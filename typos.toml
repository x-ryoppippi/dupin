[default]
locale = 'en-us'
extend-ignore-re = [
	"(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
	"(?Rm)^.*#\\s*spellchecker:disable-line$",
]

[default.extend-words]
centre = "centre"
maximise = "maximise"

[files]
ignore-hidden = false
extend-exclude = [
	".git",
	"target",
	"Cargo.lock",
	"flake.lock",
	"assets",
	"experiments/cargo-cache/results/*.json",
	"experiments/nix-cargo-cache/results/*.json",
]
