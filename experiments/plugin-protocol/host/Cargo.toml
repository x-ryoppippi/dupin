[package]
name = "dupin-protocol-host"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
dupin-plugin-protocol = { path = "../../../crates/dupin-plugin-protocol" }
# Preserve the portable dispatch fallback when LLVM cannot guarantee tail calls.
wasmi = { version = "=2.0.2", default-features = false, features = [
	"std",
	"validate",
	"auto-dispatch",
] }

[dev-dependencies]
wat = "1"
